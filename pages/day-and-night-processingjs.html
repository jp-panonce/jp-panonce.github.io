<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day and Night ProcessingJS</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
    }

    .frame {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 0;
      padding: 0;
      box-sizing: border-box;
      display: grid;
      place-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      display: block;
      background: #0c1320;
    }
  </style>
</head>

<body>
  <div class="frame">
    <canvas id="dayNightCanvas" width="400" height="400"></canvas>
  </div>

  <script src="../assets/js/day-and-night-processingjs-init.js"></script>
</body>

</html>
